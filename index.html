<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<title>よみくらべ</title>
<style>
:root{
  --bg:#ece5d8; --bg2:#e3dacb; --surface:#fffdf8; --ink:#2a2620; --muted:#7a7064; --line:#ddd3c3;
  --accent:#2f5d50; --accent-ink:#fff; --accent-soft:#dbe8e2; --danger:#b73a2b; --star:#e0a21c;
  --shadow:0 1px 2px rgba(60,45,20,.08),0 4px 14px rgba(60,45,20,.08);
  --r:12px;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  color:var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);-webkit-tap-highlight-color:transparent;font-size:15px}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%}
.i-s{width:14px;height:14px;vertical-align:-2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:999px;font-weight:600;white-space:nowrap;min-height:40px}
.btn:hover{background:#f6f1e7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:0;background:transparent;flex:none}
.icon-btn:hover{background:rgba(0,0,0,.06)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-height:42px}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin-top:6px}
.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 10px}
.demo-bar{background:#fff4d6;color:#6b5210;font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #f0dfa8}

/* ---------- join / teacher ---------- */
.center-wrap{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px}
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:440px}
.panel.wide{max-width:720px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.logo-mark{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center}
.logo h1{font-size:24px;margin:0;letter-spacing:.04em}
.tagline{color:var(--muted);margin:0 0 22px;font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.code-input{text-transform:uppercase;letter-spacing:.25em;font-weight:700;font-size:20px;text-align:center}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.recent{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.recent h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.recent-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px;text-align:left}
.recent-item code{color:var(--muted);letter-spacing:.1em}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.trow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;flex-wrap:wrap}
.trow .tn{flex:1;min-width:140px}
.trow .tn b{display:block}
.trow .tn small{color:var(--muted)}
.code-pill{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.15em;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:6px}

/* ---------- table screen ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:8px;padding:8px 12px;max-width:1400px;margin:0 auto}
.tb-title{flex:1;min-width:0}
.tb-title h2{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .sub{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 9px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px 0;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:160px;max-width:340px}
.search .ic{position:absolute;left:10px;top:11px;color:var(--muted);width:18px;height:18px}
.search input{padding-left:36px;min-height:40px}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;width:36px;height:34px;display:grid;place-items:center}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.1)}
select.input{width:auto;min-height:40px;padding:6px 10px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.tg.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;gap:6px;padding:10px 12px;max-width:1400px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.6;font-size:12px}
.teacher-bar,.notice{max-width:1400px;margin:8px auto 0;padding:0 12px}
.teacher-bar>div,.notice>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:#1d4036;border-radius:10px;padding:8px 12px;font-size:13px}
.notice>div{background:#fbe9e5;color:#7a2a1f}
.main{max-width:1400px;margin:0 auto;padding:6px 12px 120px}
.section-h{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-weight:700;font-size:14px}
.section-h .dot{width:12px;height:12px;border-radius:4px}
.section-h .n{color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;overflow:hidden;border:2px solid transparent;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card.selected{border-color:var(--accent)}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--gc,transparent);z-index:2}
.thumb{position:relative;aspect-ratio:1/1.2;background:#f4efe6;overflow:hidden;display:flex;justify-content:center;border-bottom:1px solid var(--line)}
.thumb img{width:88%;margin-top:8%;object-fit:cover;object-position:top;box-shadow:0 1px 4px rgba(0,0,0,.18);background:#fff;align-self:flex-start}
.thumb-ph{display:grid;place-items:center;width:100%;color:var(--muted)}
.thumb-ph .ic{width:40px;height:40px}
.badge{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:700;background:rgba(42,38,32,.78);color:#fff;border-radius:5px;padding:2px 6px}
.badge.w{background:#2b579a}
.new{position:absolute;left:8px;top:10px;font-size:10px;font-weight:800;background:#d9480f;color:#fff;border-radius:5px;padding:2px 6px;letter-spacing:.05em}
.checkbox{position:absolute;right:8px;top:10px;width:26px;height:26px;border-radius:8px;border:2px solid #fff;background:rgba(0,0,0,.25);display:grid;place-items:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.checkbox.on{background:var(--accent)}
.checkbox .ic{width:16px;height:16px}
.meta{padding:10px 10px 4px;flex:1;min-width:0}
.meta .title{font-weight:700;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.meta .no{color:var(--muted);font-weight:600;margin-right:4px}
.meta .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.gtag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;margin-top:5px;background:var(--bg2);border-radius:999px;padding:1px 8px 1px 6px}
.gtag i{width:8px;height:8px;border-radius:50%}
.card-actions{display:flex;justify-content:flex-end;padding:0 4px 4px}
.card-actions .icon-btn{width:34px;height:34px}
.star.on{color:var(--star)}
.grid.list{grid-template-columns:1fr;gap:8px}
.grid.list .card{flex-direction:row;align-items:center}
.grid.list .card:hover{transform:none}
.grid.list .thumb{width:56px;aspect-ratio:1/1.25;border-bottom:0;border-right:1px solid var(--line);flex:none}
.grid.list .thumb img{width:80%;margin-top:10%}
.grid.list .badge,.grid.list .new{display:none}
.grid.list .checkbox{right:auto;left:14px;top:18px}
.grid.list .meta{padding:8px 12px}
.grid.list .meta .title{-webkit-line-clamp:1}
.grid.list .card-actions{padding:0 6px}
.grid.list .card::before{right:auto;bottom:0;width:4px;height:auto}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.8}
.empty .ic{width:48px;height:48px;opacity:.5}
.selbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:8px;display:flex;gap:6px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 24px);overflow-x:auto}
.selbar .cnt{padding:0 8px;font-weight:700;white-space:nowrap}
.selbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25);min-height:38px;padding:7px 12px}
.selbar .btn.primary{background:#fff;color:var(--ink);border-color:#fff}
.dropzone{position:fixed;inset:0;z-index:60;background:rgba(47,93,80,.18);border:4px dashed var(--accent);display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--accent);pointer-events:none}

/* ---------- popover / modal / toast ---------- */
.pop{position:fixed;z-index:200;background:var(--surface);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:6px;min-width:220px;max-width:300px;max-height:70vh;overflow:auto;border:1px solid var(--line)}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.pop-item:hover{background:var(--bg)}
.pop-item.danger{color:var(--danger)}
.pop-item span{flex:1}
.pop-item .dot{width:12px;height:12px;border-radius:50%;flex:none;margin:0 4px}
.pop-item .i-check{color:var(--accent)}
.pop-sep{height:1px;background:var(--line);margin:4px 6px}
.pop-h{font-size:11.5px;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(30,25,18,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:440px;max-height:calc(100% - 16px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px 20px}
.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:6px 20px 14px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.up-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.up-row .badge{position:static;flex:none}
.up-row .info{flex:1;min-width:0}
.up-row .stat{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center}
.bar{height:4px;background:var(--bg2);border-radius:4px;overflow:hidden;flex:1;max-width:120px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.opt-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.opt{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:flex;align-items:center;gap:6px;font-size:14px}
.opt small{display:block;color:var(--muted);margin-top:3px;font-size:12px;line-height:1.5}
.grow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none}
.gcount{font-size:12px;color:var(--muted);white-space:nowrap}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;text-align:left}
.pick-item img{width:34px;height:44px;object-fit:cover;object-position:top;border:1px solid var(--line)}
.share-code{font-size:44px;font-weight:800;letter-spacing:.2em;text-align:center;color:var(--accent);margin:4px 0}
.qr{display:flex;justify-content:center;margin:10px 0}
.qr img,.qr canvas{width:180px;height:180px}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:50;background:#5b5650;display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:4px;background:var(--surface);padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.vbar::-webkit-scrollbar{display:none}
.vsep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:none}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none;margin:0 2px;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.szb{width:34px;height:34px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;flex:none}
.szb i{display:block;border-radius:50%;background:var(--ink)}
.szb.on{background:var(--accent-soft)}
.vtabs{display:none;gap:4px;padding:6px 8px;background:#47433e;overflow-x:auto;flex:none}
.vtabs button{border:0;border-radius:8px;padding:6px 10px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.vtabs button.on{background:#fff;color:var(--ink)}
.panes{flex:1;display:grid;grid-auto-columns:1fr;grid-auto-flow:column;gap:4px;min-height:0;padding:4px}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#6b665f;border-radius:8px;overflow:hidden;outline:3px solid transparent}
.panes.multi .pane.active{outline-color:#f2c94c}
.pane-h{display:flex;align-items:center;gap:2px;background:#3e3a35;color:#fff;padding:4px 4px 4px 10px;flex:none}
.pane-h .pt{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-h .pt small{font-weight:400;opacity:.7;margin-left:6px}
.pane-h .pg{font-size:12px;opacity:.8;padding:0 6px;white-space:nowrap}
.pane-h .icon-btn{color:#fff;width:34px;height:34px}
.pane-h .icon-btn:hover{background:rgba(255,255,255,.12)}
.pane-h .icon-btn.on{background:rgba(255,255,255,.2);color:#ffd866}
.memo-box{background:#fffbea;padding:8px;flex:none;border-bottom:1px solid #e6dcae}
.memo-box textarea{width:100%;height:110px;border:1px solid #e6dcae;border-radius:8px;padding:8px;resize:vertical;background:#fff}
.memo-box small{color:#7a6a2a;font-size:11.5px}
.pane-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;width:max-content;min-width:100%}
.page{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.page canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.page .ink{mix-blend-mode:multiply;touch-action:auto}
.viewer.drawing .page .ink{touch-action:none;cursor:crosshair}
.viewer.erasing .page .ink{touch-action:none;cursor:cell}
.pstatus{color:#fff;text-align:center;padding:40px 16px}
.pnum{position:absolute;right:-2px;bottom:-18px;font-size:11px;color:rgba(255,255,255,.7)}

/* docx -> pdf rendering */
.docx-render{width:680px;background:#fff;color:#000;font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS Mincho",serif;font-size:10.5pt;line-height:1.75;word-break:break-all}
.docx-render p{margin:0 0 .2em}
.docx-render p:empty::after{content:"\00a0"}
.docx-render h1{font-size:16pt;margin:.4em 0}.docx-render h2{font-size:14pt;margin:.4em 0}.docx-render h3{font-size:12pt;margin:.4em 0}
.docx-render table{border-collapse:collapse;width:100%;margin:.4em 0}
.docx-render td,.docx-render th{border:1px solid #777;padding:3px 6px;vertical-align:top}
.docx-render img{max-width:100%;height:auto}
.docx-render ul,.docx-render ol{margin:.2em 0;padding-left:1.6em}

@media (max-width:760px){
  .center-wrap{padding:24px 12px}
  .panel{padding:22px 18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .tb-hide-sm{display:none!important}
  .panes.multi{grid-auto-flow:row;grid-auto-rows:1fr}
  .panes.multi .pane.tab-hidden{display:none}
  .vtabs.show{display:flex}
}
</style>
</head>

/* ---------------- helpers ---------------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') {
      for (const [sk, sv] of Object.entries(v)) sk.startsWith('--') ? el.style.setProperty(sk, sv) : (el.style[sk] = sv);
    } else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/* ---------------- IndexedDB (端末内保存) ---------------- */
const idb = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('yomikurabe', 1);
    r.onupgradeneeded = () => { for (const n of ['ann', 'pdf', 'demo']) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
    });
  };
  const safe = p => p.catch(e => { console.warn('idb', e); return undefined; });
  return {
    get: (s, k) => safe(tx(s, 'readonly', st => st.get(k))),
    set: (s, k, v) => safe(tx(s, 'readwrite', st => st.put(v, k))),
    del: (s, k) => safe(tx(s, 'readwrite', st => st.delete(k)))
  };
})();

/* ---------------- バックエンド：デモ（この端末内） ---------------- */
function makeDemoBackend() {
  let db; const listeners = new Map();
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('yk-demo') : null;
  const clone = o => o == null ? null : JSON.parse(JSON.stringify(o));
  const load = async () => { db = (await idb.get('demo', 'db')) || { config: {}, tables: {}, blobs: {} }; };
  const notify = code => { for (const cb of listeners.get(code) || []) cb(clone(db.tables[code])); };
  const save = async code => { await idb.set('demo', 'db', db); if (code) notify(code); bc?.postMessage({ code }); };
  if (bc) bc.onmessage = async e => { await load(); if (e.data.code) notify(e.data.code); };
  const ready = load();
  return {
    demo: true,
    async getConfig() { await ready; return clone(db.config); },
    async setTeacherHash(v) { await ready; db.config.teacherHash = v; await save(); },
    async createTable(code, meta) { await ready; db.tables[code] = { meta, files: {} }; await save(code); },
    async getTableMeta(code) { await ready; return clone(db.tables[code]?.meta); },
    async listTables() { await ready; return Object.entries(db.tables).map(([code, t]) => ({ code, ...t.meta, count: Object.keys(t.files || {}).length })); },
    async updateTableMeta(code, patch) { await ready; Object.assign(db.tables[code].meta, patch); await save(code); },
    async deleteTable(code) { await ready; delete db.tables[code]; delete db.blobs[code]; await save(code); },
    watchTable(code, cb) {
      if (!listeners.has(code)) listeners.set(code, new Set());
      listeners.get(code).add(cb); ready.then(() => cb(clone(db.tables[code])));
      return () => listeners.get(code)?.delete(cb);
    },
    newId: () => Date.now().toString(36) + rid(4),
    async addFile(code, id, meta, chunks, onProgress) {
      await ready; (db.blobs[code] ||= {})[id] = chunks; onProgress?.(1);
      (db.tables[code].files ||= {})[id] = meta; await save(code);
    },
    async getFileData(code, id) { await ready; return db.blobs[code]?.[id] || null; },
    async updateFile(code, id, patch) { await ready; Object.assign(db.tables[code].files[id], patch); await save(code); },
    async deleteFile(code, id) { await ready; delete db.tables[code].files[id]; delete db.blobs[code]?.[id]; await save(code); }
  };
}

/* ---------------- バックエンド：Firebase Realtime Database ---------------- */
async function makeFirebaseBackend(cfg) {
  const appMod = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
  const D = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database.js`);
  const db = D.getDatabase(appMod.initializeApp(cfg));
  const R = p => D.ref(db, p);
  const val = async p => (await D.get(R(p))).val();
  return {
    demo: false,
    async getConfig() { return (await val('config')) || {}; },
    async setTeacherHash(v) { await D.set(R('config/teacherHash'), v); },
    async createTable(code, meta) {
      await D.set(R(`tables/${code}/meta`), meta);
      await D.set(R(`tableIndex/${code}`), { name: meta.name, createdAt: meta.createdAt });
    },
    getTableMeta: code => val(`tables/${code}/meta`),
    async listTables() { const v = (await val('tableIndex')) || {}; return Object.entries(v).map(([code, m]) => ({ code, ...m })); },
    async updateTableMeta(code, patch) {
      await D.update(R(`tables/${code}/meta`), patch);
      if (patch.name) await D.update(R(`tableIndex/${code}`), { name: patch.name });
    },
    async deleteTable(code) { await D.remove(R(`blobs/${code}`)); await D.remove(R(`tables/${code}`)); await D.remove(R(`tableIndex/${code}`)); },
    watchTable(code, cb) { return D.onValue(R(`tables/${code}`), s => cb(s.val()), e => { console.error(e); toast('通信エラー：' + e.message); }); },
    newId: () => D.push(R('_ids')).key,
    async addFile(code, id, meta, chunks, onProgress) {
      for (let i = 0; i < chunks.length; i++) { await D.set(R(`blobs/${code}/${id}/${i}`), chunks[i]); onProgress?.((i + 1) / chunks.length); }
      await D.set(R(`tables/${code}/files/${id}`), meta);
    },
    async getFileData(code, id) {
      const v = await val(`blobs/${code}/${id}`); if (!v) return null;
      return Array.isArray(v) ? v : Object.keys(v).sort((a, b) => a - b).map(k => v[k]);
    },
    updateFile: (code, id, patch) => D.update(R(`tables/${code}/files/${id}`), patch),
    async deleteFile(code, id) { await D.remove(R(`tables/${code}/files/${id}`)); await D.remove(R(`blobs/${code}/${id}`)); }
  };
}

/* ---------------- binary <-> base64 chunks ---------------- */
function bytesToChunks(u8, size = 393216) {
  const out = [];
  for (let i = 0; i < u8.length; i += size) {
    const sub = u8.subarray(i, i + size); let s = '';
    for (let j = 0; j < sub.length; j += 0x8000) s += String.fromCharCode.apply(null, sub.subarray(j, j + 0x8000));
    out.push(btoa(s));
  }
  return out;
}
function chunksToBytes(chunks) {
  const parts = chunks.map(b => { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; });
  const out = new Uint8Array(parts.reduce((a, p) => a + p.length, 0)); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

async function makeThumb(pdf) {
  const page = await pdf.getPage(1);
  const vp0 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: 260 / vp0.width });
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(Math.min(vp.height, 260 * 1.6));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return c.toDataURL('image/jpeg', 0.7);
}
async function docxToPdf(file) {
  await loadScript(LIB.mammoth); await loadScript(LIB.html2pdf);
  const arrayBuffer = await file.arrayBuffer();
  const { value: html } = await mammoth.convertToHtml({ arrayBuffer }, { ignoreEmptyParagraphs: false });
  const wrap = h('div', { class: 'docx-render', html });
  const host = h('div', { style: { position: 'fixed', left: '-10000px', top: '0' } }, wrap);
  document.body.append(host);
  try {
    await Promise.all([...wrap.querySelectorAll('img')].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
    const ab = await html2pdf().set({
      margin: [15, 15, 15, 15],
      image: { type: 'jpeg', quality: 0.9 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff', logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', 'img', 'li', 'p', 'h1', 'h2', 'h3'] }
    }).from(wrap).outputPdf('arraybuffer');
    return new Uint8Array(ab);
  } finally { host.remove(); }
}
const pdfKey = id => S.code + '/' + id;
async function getPdfBytes(id) {
  const cached = await idb.get('pdf', pdfKey(id));
  if (cached) return new Uint8Array(cached);
  const chunks = await S.backend.getFileData(S.code, id);
  if (!chunks) throw new Error('ファイルのデータが見つかりません');
  const bytes = chunksToBytes(chunks);
  idb.set('pdf', pdfKey(id), bytes.buffer.slice(0));
  return bytes;
}

/* =====================================================================

   ===================================================================== */
async function renderTeacher() {
  stopWatch(); S.code = null;
  const cfg = await S.backend.getConfig();
  const back = h('button', { class: 'linkish', onclick: () => renderJoin() }, icon('back'), '参加画面へ');
  const err = h('div', { class: 'err' });
  if (!cfg.teacherHash) {
    const p1 = h('input', { class: 'input', type: 'password', placeholder: '合言葉' });
    const p2 = h('input', { class: 'input', type: 'password', placeholder: 'もう一度' });
    mount(h('div', { class: 'center-wrap' }, h('div', { class: 'panel' }, back,
      h('h2', {}, '先生用の合言葉を決める'),
      h('p', { class: 'hint' }, '最初の1回だけ設定します。テーブルの作成・削除や、他の人の文書の削除に使います。'),
      h('div', { class: 'field' }, p1), h('div', { class: 'field' }, p2), err,
      h('button', { class: 'btn primary', style: { width: '100%' }, onclick: async () => {
        if (p1.value.length < 4) return void (err.textContent = '4文字以上にしてください');
        if (p1.value !== p2.value) return void (err.textContent = '2つが一致しません');
        const hh = await sha256('yk:' + p1.value);
        try { await S.backend.setTeacherHash(hh); LS.set('yk:teacher', hh); S.teacher = true; renderTeacher(); }
        catch (e) { err.textContent = '保存できませんでした：' + e.message; }
      } }, '設定する'))));
    return p1.focus();
  }
  if (LS.get('yk:teacher') !== cfg.teacherHash) {
    S.teacher = false;
    const p = h('input', { class: 'input', type: 'password', placeholder: '先生用の合言葉' });
    const go = async () => {
      const hh = await sha256('yk:' + p.value);
      if (hh !== cfg.teacherHash) return void (err.textContent = '合言葉が違います');
      LS.set('yk:teacher', hh); S.teacher = true; renderTeacher();
    };
    p.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    mount(h('div', { class: 'center-wrap' }, h('div', { class: 'panel' }, back,
      h('h2', {}, '先生メニュー'), h('div', { class: 'field' }, p), err,
      h('button', { class: 'btn primary', style: { width: '100%' }, onclick: go }, '入る'))));
    return p.focus();
  }
  S.teacher = true;
  const nameIn = h('input', { class: 'input', placeholder: '例：2年1組 国語「羅生門」感想' });
  const list = h('div', { class: 'tlist' }, h('p', { class: 'hint' }, '読み込み中…'));
  const create = async () => {
    const name = nameIn.value.trim(); if (!name) return void (err.textContent = 'テーブル名を入れてください');
    const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let code;
    for (let i = 0; i < 20; i++) {
      code = Array.from(crypto.getRandomValues(new Uint8Array(5)), b => A[b % A.length]).join('');
      if (!(await S.backend.getTableMeta(code))) break;
    }
    await S.backend.createTable(code, { name, createdAt: Date.now(), locked: false });
    nameIn.value = ''; err.textContent = ''; toast('テーブル「' + name + '」を作りました'); drawList();
  };
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) create(); });
  async function drawList() {
    const ts = (await S.backend.listTables()).sort((a, b) => b.createdAt - a.createdAt);
    list.replaceChildren(...(ts.length ? ts.map(t => h('div', { class: 'trow' },
      h('div', { class: 'tn' }, h('b', {}, t.name), h('small', {}, new Date(t.createdAt).toLocaleDateString('ja-JP'), t.count != null ? ` ・ ${t.count}件` : '')),
      h('span', { class: 'code-pill' }, t.code),
      h('button', { class: 'btn', onclick: () => showShare(t.code, t.name) }, icon('link'), '共有'),
      h('button', { class: 'btn primary', onclick: () => { if (!S.me.name) { S.me.name = '先生'; LS.set('yk:name', '先生'); } enterTable(t.code); } }, '開く'),
      h('button', { class: 'icon-btn', title: '削除', onclick: async () => {
        if (await confirmBox('テーブルを削除', `「${t.name}」と、アップされた文書をすべて削除します。元に戻せません。`, '削除する', true)) {
          await S.backend.deleteTable(t.code); toast('削除しました'); drawList();
        }
      } }, icon('trash'))
    )) : [h('p', { class: 'hint' }, 'まだテーブルがありません。')]));
  }
  mount(h('div', { class: 'center-wrap' }, h('div', { class: 'panel wide' },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } }, back,
      h('button', { class: 'linkish', onclick: () => { LS.set('yk:teacher', null); S.teacher = false; toast('先生モードを終了しました'); renderJoin(); } }, icon('logout'), '先生モード終了')),
    h('h2', {}, '先生メニュー'),
    h('div', { class: 'field' }, h('label', {}, '新しいテーブル'),
      h('div', { style: { display: 'flex', gap: '8px' } }, nameIn, h('button', { class: 'btn primary', onclick: create }, icon('plus'), '作成'))),
    err,
    h('h3', { style: { marginBottom: '0' } }, 'テーブル一覧'), list

}

function enterTable(code) {
  stopWatch();
  S.code = code; S.prefs = loadPrefs(code); S.files = []; S.table = null;
  S.ui.select = false; S.ui.selected.clear(); S.ui.filter = 'all'; S.ui.search = '';
  history.replaceState(null, '', '#t=' + code);
  buildTableShell();
  S.unwatch = S.backend.watchTable(code, t => {
    if (S.code !== code) return;
    if (!t || !t.meta) { closeViewer(true); renderJoin('テーブルが見つかりません（削除された可能性があります）'); history.replaceState(null, '', location.pathname); return; }
    S.table = t.meta;
    const recent = LS.get('yk:recent', []).filter(r => r.code !== code);
    recent.unshift({ code, name: t.meta.name }); LS.set('yk:recent', recent.slice(0, 8));
    S.files = Object.entries(t.files || {}).map(([id, f]) => ({ id, ...f }))
      .sort((a, b) => (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : 1));
    S.files.forEach((f, i) => { f.no = i + 1; });
    const ids = new Set(S.files.map(f => f.id));
    for (const id of [...S.ui.selected]) if (!ids.has(id)) S.ui.selected.delete(id);
    updateTable();
  });
}

      h('div', { class: 'tb-title' }, E.title, E.sub),
      E.upBtn, E.fileIn)),

}
function setLayout(v) { S.ui.layout = v; LS.set('yk:layout', v); updateTable(); }

function drawChips() {
  const fs = S.files, P = S.prefs;
  const chip = (key, label, n, dot) => h('button', { class: 'chip' + (S.ui.filter === key ? ' on' : ''), onclick: () => { S.ui.filter = key; drawChips(); drawGrid(); } },
    dot ? h('i', { class: 'dot', style: { background: dot } }) : null, label, h('span', { class: 'n' }, n));
  S.el.chips.replaceChildren(
    chip('all', 'すべて', fs.length),
    chip('fav', '★ お気に入り', fs.filter(f => P.fav[f.id]).length),
    ...P.groups.map(g => chip('g:' + g.id, g.name || '(名前なし)', fs.filter(f => P.assign[f.id] === g.id).length, g.color)),
    P.groups.length ? chip('none', '未分類', fs.filter(f => !groupOf(f.id)).length) : null,
    h('button', { class: 'chip', onclick: async () => { const g = await newGroupDialog(); if (g) { drawChips(); } } }, icon('plus', 'i-s'), 'グループ'));
}

function visibleFiles() {
  let fs = S.files.slice(); const P = S.prefs, F = S.ui.filter;
  const q = S.ui.search.trim().toLowerCase();
  if (q) fs = fs.filter(f => (f.title || '').toLowerCase().includes(q) || (!f.anonymous && (f.author || '').toLowerCase().includes(q)) || ('#' + f.no) === q);
  if (F === 'fav') fs = fs.filter(f => P.fav[f.id]);
  else if (F === 'none') fs = fs.filter(f => !groupOf(f.id));
  else if (F.startsWith('g:')) fs = fs.filter(f => P.assign[f.id] === F.slice(2));
  const coll = new Intl.Collator('ja');
  if (S.ui.sort === 'new') fs.reverse();
  else if (S.ui.sort === 'title') fs.sort((a, b) => coll.compare(a.title || '', b.title || ''));
  else if (S.ui.sort === 'author') fs.sort((a, b) => (a.anonymous - b.anonymous) || coll.compare(a.author || '', b.author || ''));
  return fs;
}

function drawGrid() {
  const E = S.el; if (!E) return;
  const fs = visibleFiles();
  const mkGrid = list => h('div', { class: 'grid' + (S.ui.layout === 'list' ? ' list' : '') }, list.map(fileCard));
  let content;
  if (!S.files.length) {
    content = h('div', { class: 'empty' }, icon('doc'), h('p', {}, 'まだ文書がありません。', h('br'), '右上の「アップロード」から PDF や Word を追加しましょう。', h('br'), h('small', {}, 'パソコンならファイルをこの画面にドラッグしてもOKです。')));
  } else if (!fs.length) {
    content = h('div', { class: 'empty' }, h('p', {}, '該当する文書はありません。'));
  } else if (S.ui.groupView && (S.ui.filter === 'all' || S.ui.filter === 'fav') && S.prefs.groups.length) {
    const secs = [];
    for (const g of S.prefs.groups) {
      const l = fs.filter(f => S.prefs.assign[f.id] === g.id); if (!l.length) continue;
      secs.push(h('div', { class: 'section-h' }, h('i', { class: 'dot', style: { background: g.color } }), g.name || '(名前なし)', h('span', { class: 'n' }, l.length + '件')), mkGrid(l));
    }
    const rest = fs.filter(f => !groupOf(f.id));
    if (rest.length) secs.push(h('div', { class: 'section-h' }, '未分類', h('span', { class: 'n' }, rest.length + '件')), mkGrid(rest));
    content = secs;
  } else content = [h('div', { style: { height: '6px' } }), mkGrid(fs)];
  E.grid.replaceChildren(...[content].flat());
}

function toggleSel(id) { S.ui.selected.has(id) ? S.ui.selected.delete(id) : S.ui.selected.add(id); drawGrid(); drawSelbar(); }
function toggleFav(ids, force) {

function assignGroup(ids, gid) {
  for (const id of ids) gid ? (S.prefs.assign[id] = gid) : delete S.prefs.assign[id];
  savePrefs(); drawChips(); drawGrid();
}
function createGroup(name) {
  const used = new Set(S.prefs.groups.map(g => g.color));
  const color = GROUP_COLORS.find(c => !used.has(c)) || GROUP_COLORS[S.prefs.groups.length % GROUP_COLORS.length];
  const g = { id: rid(6), name, color }; S.prefs.groups.push(g); savePrefs(); return g;
}
async function newGroupDialog() {
  const n = await askText('新しいグループ', 'グループは自分の画面だけのものです（他の人には見えません）。', 'グループ' + (S.prefs.groups.length + 1), '作成');
  return n ? createGroup(n) : null;
}
function groupMenuItems(ids) {
  const cur = ids.length === 1 ? S.prefs.assign[ids[0]] : null;
  return [
    { header: 'グループに入れる' },
    ...S.prefs.groups.map(g => ({ text: g.name || '(名前なし)', dot: g.color, checked: cur === g.id, action: () => assignGroup(ids, g.id) })),
    { text: '新しいグループを作って入れる', icon: 'plus', action: async () => { const g = await newGroupDialog(); if (g) assignGroup(ids, g.id); } },
    ids.some(id => S.prefs.assign[id]) ? { text: 'グループから外す', icon: 'x', action: () => assignGroup(ids, null) } : null
  ];
}
function fileMenu(f, anchor) {

  popMenu(anchor, [
    { text: fav ? 'お気に入りから外す' : 'お気に入りに追加', icon: 'star', action: () => toggleFav([f.id]) },

      const t = await askText('タイトルを変更', '', f.title, '変更'); if (t) S.backend.updateFile(S.code, f.id, { title: t });

      if (await confirmBox('文書を削除', `「${f.title}」をテーブルから削除します。全員の画面から消えます。`, '削除する', true)) {
        await S.backend.deleteFile(S.code, f.id); idb.del('pdf', pdfKey(f.id)); toast('削除しました');
      }

  ]);
}
async function downloadFile(f) {
  try {
    const bytes = await getPdfBytes(f.id);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = h('a', { href: url, download: (f.title || 'document') + '.pdf' }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { toast('ダウンロードできませんでした：' + e.message); }
}
function drawSelbar() {
  const E = S.el, n = S.ui.selected.size, ids = [...S.ui.selected];
  E.selbar.hidden = !S.ui.select;
  if (!S.ui.select) return;
  E.selbar.replaceChildren(
    h('span', { class: 'cnt' }, n ? `${n}件選択` : '文書をタップして選択'),
    h('button', { class: 'btn primary', disabled: !n, onclick: () => {
      if (n > 3) return toast('並べて読めるのは3つまでです');
      const order = S.files.filter(f => S.ui.selected.has(f.id)).map(f => f.id);

    } }, icon('columns', 'i-s'), '並べて読む'),
    h('button', { class: 'btn', disabled: !n, onclick: () => toggleFav(ids) }, icon('star', 'i-s'), 'お気に入り'),
    h('button', { class: 'btn', disabled: !n, onclick: e => popMenu(e.currentTarget, groupMenuItems(ids)) }, icon('folder', 'i-s'), 'グループ'),
    h('button', { class: 'btn', onclick: () => { const v = visibleFiles(); const all = v.every(f => S.ui.selected.has(f.id)); v.forEach(f => all ? S.ui.selected.delete(f.id) : S.ui.selected.add(f.id)); drawGrid(); drawSelbar(); } }, '全選択'),
    h('button', { class: 'btn', onclick: () => { S.ui.select = false; S.ui.selected.clear(); updateTable(); } }, '終了'));
}

function manageGroups() {
  const list = h('div');
  const draw = () => {
    const P = S.prefs;
    list.replaceChildren(...(P.groups.length ? P.groups.map((g, i) => h('div', { class: 'grow' },
      h('button', { class: 'cdot', title: '色を変える', style: { background: g.color }, onclick: () => {
        g.color = GROUP_COLORS[(GROUP_COLORS.indexOf(g.color) + 1) % GROUP_COLORS.length]; savePrefs(); draw(); updateTable();
      } }),
      h('input', { class: 'input', value: g.name, oninput: e => { g.name = e.target.value; savePrefs(); drawChips(); drawGrid(); } }),
      h('span', { class: 'gcount' }, S.files.filter(f => P.assign[f.id] === g.id).length + '件'),
      h('button', { class: 'icon-btn', title: '上へ', disabled: i === 0, onclick: () => { P.groups.splice(i - 1, 0, P.groups.splice(i, 1)[0]); savePrefs(); draw(); updateTable(); } }, '↑'),
      h('button', { class: 'icon-btn', title: '削除', onclick: async () => {
        if (!(await confirmBox('グループを削除', `「${g.name}」を削除します。中の文書は消えず「未分類」に戻ります。`, '削除', true))) return;
        P.groups = P.groups.filter(x => x.id !== g.id);
        for (const [fid, gid] of Object.entries(P.assign)) if (gid === g.id) delete P.assign[fid];
        if (S.ui.filter === 'g:' + g.id) S.ui.filter = 'all';
        savePrefs(); draw(); updateTable();
      } }, icon('trash'))
    )) : [h('p', { class: 'hint' }, 'まだグループがありません。')]));
  };
  draw();
  modal({ title: 'グループ管理', body: [
    h('p', { class: 'hint' }, 'グループ分けは自分の端末だけに保存され、他の参加者には見えません。色の丸をタップすると色が変わります。'),
    list,
    h('button', { class: 'btn ghost', onclick: () => { createGroup('グループ' + (S.prefs.groups.length + 1)); draw(); updateTable(); } }, icon('plus'), 'グループを追加')
  ], actions: [{ text: '閉じる', kind: 'primary' }] });
}

/* ---------------- アップロード ---------------- */
async function startUpload(fileList) {
  if (!S.table) return;
  if (S.table.locked && !S.teacher) return toast('現在アップロードは締め切られています');
  const ok = fileList.filter(f => /\.(pdf|docx)$/i.test(f.name));
  if (fileList.some(f => /\.doc$/i.test(f.name))) toast('古い形式(.doc)は非対応です。Wordで .docx か PDF に保存し直してください');
  else if (ok.length < fileList.length) toast('PDF と Word(.docx) のみアップできます');
  if (!ok.length) return;
  let anon = LS.get('yk:anon', false);
  const rows = ok.map(file => {
    const isDocx = /\.docx$/i.test(file.name);
    const r = { file, isDocx, title: h('input', { class: 'input', value: file.name.replace(/\.(pdf|docx)$/i, '') }), stat: h('span', {}, isDocx ? 'Word → PDFに変換してアップ' : '待機中'), bar: h('i') };
    r.el = h('div', { class: 'up-row' }, h('span', { class: 'badge' + (isDocx ? ' w' : '') }, isDocx ? 'Word' : 'PDF'),
      h('div', { class: 'info' }, r.title, h('div', { class: 'stat' }, fmtSize(file.size), r.stat, h('span', { class: 'bar' }, r.bar))));
    return r;
  });
  const optNamed = h('button', { class: 'opt', onclick: () => setAnon(false) }, h('b', {}, icon('user', 'i-s'), '名前を出す'), h('small', {}, `「${S.me.name}」と表示されます`));
  const optAnon = h('button', { class: 'opt', onclick: () => setAnon(true) }, h('b', {}, icon('anon', 'i-s'), '匿名'), h('small', {}, '名前は保存されず、先生にも分かりません'));
  const setAnon = v => { anon = v; LS.set('yk:anon', v); optNamed.classList.toggle('on', !v); optAnon.classList.toggle('on', v); };
  setAnon(anon);
  let busy = false, ov = null;
  await modal({ bind: (_c, o) => { ov = o; }, title: `アップロード（${rows.length}件）`, wide: true, body: [
    h('div', {}, rows.map(r => r.el)),
    h('div', { class: 'opt-cards' }, optNamed, optAnon),
    rows.some(r => r.isDocx) ? h('p', { class: 'hint' }, 'Wordはこの端末でPDFに変換されます。文字・表・画像は残りますが、縦書きや細かいレイアウトは崩れることがあります。崩れる場合は Word で「PDFとして保存」してからアップしてください。') : null
  ], actions: [
    { text: 'キャンセル', value: null, onClick: () => busy ? false : undefined },
    { text: 'アップロード', kind: 'primary', onClick: async () => {
      if (busy) return false;
      busy = true;
      ov.dataset.busy = '1';
      ov.querySelectorAll('.modal-f .btn, .opt, .up-row input').forEach(b => b.disabled = true);
      let fail = 0;
      for (const r of rows) {
        try {
          let bytes;
          if (r.isDocx) { r.stat.textContent = '変換中…'; bytes = await docxToPdf(r.file); }
          else bytes = new Uint8Array(await r.file.arrayBuffer());
          if (bytes.length > MAX_BYTES) throw new Error(`大きすぎます（${fmtSize(bytes.length)}、上限15MB）`);
          r.stat.textContent = '確認中…';
          const pdf = await openPdf(bytes);
          const pages = pdf.numPages; const thumb = await makeThumb(pdf).catch(() => null); pdf.destroy();
          r.stat.textContent = 'アップロード中…';
          const id = S.backend.newId();
          const meta = { title: r.title.value.trim() || r.file.name, srcType: r.isDocx ? 'docx' : 'pdf', anonymous: !!anon, author: anon ? null : S.me.name,
            pages, size: bytes.length, thumb, createdAt: Date.now() };
          S.prefs.mine[id] = 1; S.prefs.seen[id] = 1; savePrefs();
          await S.backend.addFile(S.code, id, meta, bytesToChunks(bytes), p => { r.bar.style.width = Math.round(p * 100) + '%'; });
          idb.set('pdf', pdfKey(id), bytes.buffer.slice(0));
          r.bar.style.width = '100%'; r.stat.textContent = '完了 ✓';
        } catch (e) {
          console.error(e); fail++; r.stat.textContent = '失敗：' + (e.message || e); r.stat.style.color = 'var(--danger)';
        }
      }
      delete ov.dataset.busy; busy = false;
      if (!fail) { toast('アップロードしました'); return 'done'; }
      ov.querySelectorAll('.modal-f .btn').forEach(b => b.disabled = false);
      return false;
    } }
  ] });
}

/* =====================================================================
   ビューア（1つ〜3つ並べて表示・書き込み）
   ===================================================================== */
const V = { el: null, panes: [], active: null, tool: 'hand', colors: { pen: PEN_COLORS[1], marker: MARKER_COLORS[0] }, size: { pen: 1, marker: 1 }, sync: false, syncing: false, tab: 0 };
const annKey = id => S.code + '/' + id;

function buildViewer() {
  V.bar = h('div', { class: 'vbar' });
  V.tabs = h('div', { class: 'vtabs' });
  V.panesEl = h('div', { class: 'panes' });
  V.el = h('div', { class: 'viewer', hidden: true }, V.bar, V.tabs, V.panesEl);
  document.body.append(V.el);
  addEventListener('resize', () => { clearTimeout(V.rt); V.rt = setTimeout(() => V.panes.forEach(p => p.layout()), 200); });
  addEventListener('popstate', () => { if (!V.el.hidden) closeViewer(true); });
  addEventListener('keydown', e => {
    if (V.el.hidden || document.querySelector('.overlay')) return;
    if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); V.active?.undoOnce(); }
    if (e.key === 'Escape') closeViewer();
  });
}
function drawVbar() {
  const tool = (t, ic, label) => h('button', { class: 'icon-btn' + (V.tool === t ? ' on' : ''), title: label, 'aria-label': label, onclick: () => { V.tool = t; applyTool(); drawVbar(); } }, icon(ic));
  const t = V.tool, multi = V.panes.length > 1;
  const items = [
    h('button', { class: 'btn', style: { minHeight: '36px', padding: '6px 12px' }, onclick: () => closeViewer() }, icon('back', 'i-s'), 'テーブル'),
    h('span', { class: 'vsep' }),
    tool('hand', 'hand', 'スクロール'), tool('pen', 'pen', 'ペン'), tool('marker', 'marker', 'マーカー'), tool('eraser', 'eraser', '消しゴム')
  ];
  if (t === 'pen' || t === 'marker') {
    items.push(h('span', { class: 'vsep' }));
    for (const c of (t === 'pen' ? PEN_COLORS : MARKER_COLORS))
      items.push(h('button', { class: 'sw' + (V.colors[t] === c ? ' on' : ''), style: { background: c }, 'aria-label': '色', onclick: () => { V.colors[t] = c; drawVbar(); } }));
    items.push(h('span', { class: 'vsep' }));
    SIZES[t].forEach((_, i) => items.push(h('button', { class: 'szb' + (V.size[t] === i ? ' on' : ''), title: ['細', '中', '太'][i], onclick: () => { V.size[t] = i; drawVbar(); } },
      h('i', { style: { width: (4 + i * 4) + 'px', height: (4 + i * 4) + 'px' } }))));
  }
  items.push(h('span', { class: 'vsep' }),
    h('button', { class: 'icon-btn', title: '元に戻す', onclick: () => V.active?.undoOnce() }, icon('undo')),
    h('button', { class: 'icon-btn', title: '書き込みを全部消す', onclick: () => V.active?.clearAll() }, icon('trash')));
  if (multi) items.push(h('span', { class: 'vsep' }),
    h('button', { class: 'tg' + (V.sync ? ' on' : ''), style: { flex: 'none' }, onclick: () => { V.sync = !V.sync; drawVbar(); } }, icon('sync', 'i-s'), 'スクロール連動'));
  if (V.panes.length < 3) items.push(h('span', { class: 'vsep' }),
    h('button', { class: 'tg', style: { flex: 'none' }, onclick: () => pickFiles() }, icon('columns', 'i-s'), '並べる'));
  V.bar.replaceChildren(...items);
}
function applyTool() {
  V.el.classList.toggle('drawing', V.tool === 'pen' || V.tool === 'marker');
  V.el.classList.toggle('erasing', V.tool === 'eraser');
}
function drawTabs() {
  const multi = V.panes.length > 1;
  V.panesEl.classList.toggle('multi', multi);
  V.tabs.classList.toggle('show', multi);
  V.tab = Math.min(V.tab, V.panes.length - 1);
  V.panes.forEach((p, i) => p.el.classList.toggle('tab-hidden', i !== V.tab));
  V.tabs.replaceChildren(...V.panes.map((p, i) => h('button', { class: i === V.tab ? 'on' : '', onclick: () => { V.tab = i; setActive(p); drawTabs(); p.layout(); } }, `#${p.file.no} ${p.file.title}`)));
}
function setActive(p) { V.active = p; V.panes.forEach(x => x.el.classList.toggle('active', x === p)); }

function openViewer(ids) {
  if (!V.el) buildViewer();
  const wasOpen = !V.el.hidden;
  V.el.hidden = false; document.body.classList.add('noscroll');
  if (!wasOpen) history.pushState({ viewer: 1 }, '', location.hash || '#');
  for (const id of ids) addPane(id);
  applyTool(); drawVbar(); drawTabs();
}
function addPane(id) {
  if (V.panes.length >= 3) return toast('並べられるのは3つまでです');
  if (V.panes.some(p => p.id === id)) return;
  const f = S.files.find(x => x.id === id); if (!f) return;
  S.prefs.seen[id] = 1; savePrefs();
  const p = new Pane(f); V.panes.push(p); V.panesEl.append(p.el);
  V.tab = V.panes.length - 1; setActive(p);
  requestAnimationFrame(() => { V.panes.forEach(x => x !== p && x.layout()); p.load(); });
}
function removePane(p) {
  p.destroy(); V.panes = V.panes.filter(x => x !== p); p.el.remove();
  if (!V.panes.length) return closeViewer();
  if (V.active === p) setActive(V.panes[0]);
  drawVbar(); drawTabs(); requestAnimationFrame(() => V.panes.forEach(x => x.layout()));
}
function closeViewer(fromPop) {
  if (!V.el || V.el.hidden) return;
  if (!fromPop && history.state?.viewer) { history.back(); return; }
  V.panes.forEach(p => { p.destroy(); p.el.remove(); });
  V.panes = []; V.active = null; V.el.hidden = true; document.body.classList.remove('noscroll');
  if (S.code) updateTable();
}
async function pickFiles(firstId) {
  const open = new Set(V.panes.map(p => p.id));
  const chosen = new Set(firstId ? [firstId] : []);
  const max = 3 - open.size;
  const list = h('div', { class: 'pick-list' });
  const draw = () => list.replaceChildren(...S.files.filter(f => !open.has(f.id)).map(f => h('button', {
    class: 'pick-item', style: chosen.has(f.id) ? { borderColor: 'var(--accent)', background: 'var(--accent-soft)' } : null,
    onclick: () => { if (chosen.has(f.id)) chosen.delete(f.id); else if (chosen.size < max) chosen.add(f.id); else toast(`あと${max}つまで選べます`); draw(); }
  }, f.thumb ? h('img', { src: f.thumb, alt: '' }) : icon('doc'),
    h('div', { style: { flex: '1', minWidth: '0' } }, h('b', {}, `#${f.no} ${f.title}`), h('div', { class: 'hint', style: { margin: '0' } }, f.anonymous ? '匿名' : f.author)),
    chosen.has(f.id) ? icon('check') : (S.prefs.fav[f.id] ? h('span', { style: { color: 'var(--star)' } }, icon('starFill')) : null))));
  draw();
  const r = await modal({ title: '並べて読む文書を選ぶ', wide: true, body: [h('p', { class: 'hint' }, `最大3つまで並べられます（あと${max}つ）。`), list],
    actions: [{ text: 'キャンセル', value: null }, { text: '開く', kind: 'primary', onClick: () => chosen.size ? [...chosen] : (toast('文書を選んでください'), false) }] });
  if (r) openViewer(S.files.filter(f => r.includes(f.id)).map(f => f.id));
}

class Pane {
  constructor(file) {
    this.file = file; this.id = file.id; this.zoom = 1; this.pages = []; this.visible = new Set();
    this.ann = { pages: {}, memo: '' }; this.hist = []; this.drag = null;
    const fav = !!S.prefs.fav[this.id];
    this.pgEl = h('span', { class: 'pg' });
    this.memoTa = h('textarea', { placeholder: 'この文書についてのメモ（自分だけに保存）' });
    this.memoTa.addEventListener('input', () => { this.ann.memo = this.memoTa.value; this.save(); });
    this.memoBox = h('div', { class: 'memo-box', hidden: true }, this.memoTa, h('small', {}, 'メモと書き込みはこの端末にだけ保存され、他の人には見えません。'));
    this.memoBtn = h('button', { class: 'icon-btn', title: 'メモ', onclick: () => { this.memoBox.hidden = !this.memoBox.hidden; this.memoBtn.classList.toggle('on', !this.memoBox.hidden); if (!this.memoBox.hidden) this.memoTa.focus(); } }, icon('doc'));
    this.starBtn = h('button', { class: 'icon-btn' + (fav ? ' on' : ''), title: 'お気に入り', onclick: () => {
      toggleFav([this.id]); const on = !!S.prefs.fav[this.id]; this.starBtn.classList.toggle('on', on); this.starBtn.replaceChildren(icon(on ? 'starFill' : 'star'));
    } }, icon(fav ? 'starFill' : 'star'));
    this.pagesEl = h('div', { class: 'pages' }, h('div', { class: 'pstatus' }, '読み込み中…'));
    this.scroll = h('div', { class: 'pane-scroll' }, this.pagesEl);
    this.scroll.addEventListener('scroll', () => this.onScroll(), { passive: true });
    this.el = h('div', { class: 'pane', onpointerdown: () => setActive(this) },
      h('div', { class: 'pane-h' },
        h('div', { class: 'pt', title: file.title }, `#${file.no} ${file.title}`, h('small', {}, file.anonymous ? '匿名' : file.author)),
        this.pgEl,
        h('button', { class: 'icon-btn', title: '縮小', onclick: () => this.setZoom(-1) }, icon('zoomOut')),
        h('button', { class: 'icon-btn', title: '拡大', onclick: () => this.setZoom(1) }, icon('zoomIn')),
        this.starBtn, this.memoBtn,
        h('button', { class: 'icon-btn', title: 'ダウンロード', onclick: () => downloadFile(file) }, icon('download')),
        h('button', { class: 'icon-btn', title: '閉じる', onclick: () => removePane(this) }, icon('x'))),
      this.memoBox, this.scroll);
  }
  async load() {
    try {
      const [bytes, ann] = await Promise.all([getPdfBytes(this.id), idb.get('ann', annKey(this.id))]);
      if (this.dead) return;
      if (ann) { this.ann = { pages: ann.pages || {}, memo: ann.memo || '' }; this.memoTa.value = this.ann.memo; if (this.ann.memo) { this.memoBox.hidden = false; this.memoBtn.classList.add('on'); } }
      this.pdf = await openPdf(bytes);
      if (this.dead) return this.pdf.destroy();
      this.io = new IntersectionObserver(es => {
        for (const e of es) {
          const p = e.target._p;
          if (e.isIntersecting) { this.visible.add(p); if (!p.rendered) this.render(p); }
          else { this.visible.delete(p); this.release(p); }
        }
      }, { root: this.scroll, rootMargin: '900px 0px' });
      const els = [];
      for (let i = 1; i <= this.pdf.numPages; i++) {
        const page = await this.pdf.getPage(i); if (this.dead) return;
        const vp = page.getViewport({ scale: 1 });
        const p = { i, page, w: vp.width, h: vp.height, rendered: false, task: null };
        p.pdfC = h('canvas'); p.inkC = h('canvas', { class: 'ink' });
        p.el = h('div', { class: 'page' }, p.pdfC, p.inkC, h('span', { class: 'pnum' }, i));
        p.el._p = p; this.bindInk(p); this.pages.push(p); els.push(p.el);
      }
      this.pagesEl.replaceChildren(...els);
      this.layout(); this.pages.forEach(p => this.io.observe(p.el)); this.onScroll();
    } catch (e) {
      console.error(e);
      this.pagesEl.replaceChildren(h('div', { class: 'pstatus' }, '開けませんでした：' + (e.message || e)));
    }
  }
  layout() {
    if (!this.pages.length) return;
    const ratio = this.scroll.scrollHeight ? this.scroll.scrollTop / this.scroll.scrollHeight : 0;
    const avail = Math.max(200, Math.min(this.scroll.clientWidth - 24, 1000));
    for (const p of this.pages) {
      p.cssW = Math.round(avail * this.zoom); p.cssH = Math.round(p.cssW * p.h / p.w);
      p.el.style.width = p.cssW + 'px'; p.el.style.height = p.cssH + 'px'; p.rendered = false;
    }
    this.scroll.scrollTop = ratio * this.scroll.scrollHeight;
    for (const p of this.visible) this.render(p);
  }
  setZoom(d) {
    const i = ZOOMS.indexOf(this.zoom); const ni = Math.max(0, Math.min(ZOOMS.length - 1, (i < 0 ? 3 : i) + d));
    this.zoom = ZOOMS[ni]; this.layout(); toast(Math.round(this.zoom * 100) + '%');
  }
  async render(p) {
    p.rendered = true;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = p.page.getViewport({ scale: p.cssW / p.w * dpr });
    if (p.task) { p.task.cancel(); p.task = null; }
    const off = document.createElement('canvas'); off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
    const task = p.task = p.page.render({ canvasContext: off.getContext('2d'), viewport: vp });
    try { await task.promise; } catch { return; }
    if (p.task !== task || this.dead) return;
    p.task = null;
    p.pdfC.width = off.width; p.pdfC.height = off.height; p.pdfC.getContext('2d').drawImage(off, 0, 0);
    p.inkC.width = off.width; p.inkC.height = off.height; this.drawInk(p);
  }
  release(p) {
    if (p.task) { p.task.cancel(); p.task = null; }
    p.pdfC.width = p.pdfC.height = 0; p.inkC.width = p.inkC.height = 0; p.rendered = false;
  }
  onScroll() {
    if (this.pages.length) {
      const y = this.scroll.scrollTop + this.scroll.clientHeight / 3;
      let cur = 1; for (const p of this.pages) { if (p.el.offsetTop <= y) cur = p.i; else break; }
      this.pgEl.textContent = `${cur} / ${this.pages.length}`;
    }
    if (V.sync && !V.syncing && V.panes.length > 1) {
      const s = this.scroll, r = s.scrollTop / Math.max(1, s.scrollHeight - s.clientHeight);
      V.syncing = true;
      for (const o of V.panes) if (o !== this) o.scroll.scrollTop = r * (o.scroll.scrollHeight - o.scroll.clientHeight);
      requestAnimationFrame(() => requestAnimationFrame(() => { V.syncing = false; }));
    }
  }
  /* ---- ink ---- */
  drawInk(p, extra) {
    const c = p.inkC; if (!c.width) return;
    const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
    const list = (this.ann.pages[p.i] || []).concat(extra ? [extra] : []);
    for (const s of list) drawStroke(ctx, s, c.width, c.height);
  }
  norm(e, p) {
    const r = p.inkC.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) / r.width * 1e4) / 1e4, Math.round((e.clientY - r.top) / r.height * 1e4) / 1e4];
  }
  bindInk(p) {
    const c = p.inkC;
    c.addEventListener('pointerdown', e => {
      setActive(this);
      if (V.tool === 'hand' || (e.pointerType === 'mouse' && e.button !== 0)) return;
      e.preventDefault(); c.setPointerCapture(e.pointerId);
      const [x, y] = this.norm(e, p);
      if (V.tool === 'eraser') { this.drag = { p, id: e.pointerId, removed: [] }; this.eraseAt(p, x, y); }
      else {
        const t = V.tool;
        this.drag = { p, id: e.pointerId, stroke: { t, c: V.colors[t], w: SIZES[t][V.size[t]] / 800, p: [x, y] } };
        this.drawInk(p, this.drag.stroke);
      }
    });
    c.addEventListener('pointermove', e => {
      const d = this.drag; if (!d || d.p !== p || d.id !== e.pointerId) return;
      e.preventDefault();
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of (evs.length ? evs : [e])) {
        const [x, y] = this.norm(ev, p);
        if (d.stroke) { const a = d.stroke.p; const lx = a[a.length - 2], ly = a[a.length - 1]; if (Math.abs(x - lx) + Math.abs(y - ly) > 0.0015) a.push(x, y); }
        else this.eraseAt(p, x, y);
      }
      if (d.stroke && !this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; if (this.drag?.stroke) this.drawInk(p, this.drag.stroke); });
    });
    const end = e => {
      const d = this.drag; if (!d || d.p !== p || d.id !== e.pointerId) return;
      this.drag = null;
      if (d.stroke) {
        (this.ann.pages[p.i] ||= []).push(d.stroke);
        this.hist.push({ op: 'add', page: p.i, stroke: d.stroke }); this.drawInk(p); this.save();
      } else if (d.removed.length) { this.hist.push({ op: 'del', page: p.i, items: d.removed }); this.save(); }
    };
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  }
  eraseAt(p, x, y) {
    const arr = this.ann.pages[p.i]; if (!arr || !arr.length) return;
    const ar = p.cssH / p.cssW, r = 12 / p.cssW; let hit = false;
    for (let k = arr.length - 1; k >= 0; k--) {
      const s = arr[k];
      if (strokeHit(s, x, y, r + s.w / 2, ar)) { this.drag.removed.push({ s, idx: k }); arr.splice(k, 1); hit = true; }
    }
    if (hit) this.drawInk(p);
  }
  undoOnce() {
    const a = this.hist.pop(); if (!a) return toast('元に戻す操作はありません');
    if (a.op === 'add') { const arr = this.ann.pages[a.page] || []; const i = arr.indexOf(a.stroke); if (i >= 0) arr.splice(i, 1); }
    else if (a.op === 'del') { const arr = (this.ann.pages[a.page] ||= []); for (const it of a.items.slice().reverse()) arr.splice(Math.min(it.idx, arr.length), 0, it.s); }
    else if (a.op === 'clear') this.ann.pages = a.pages;
    this.pages.forEach(p => this.drawInk(p)); this.save();
  }
  async clearAll() {
    if (!Object.values(this.ann.pages).some(a => a.length)) return toast('書き込みはありません');
    if (!(await confirmBox('書き込みを消す', `「${this.file.title}」の線・マーカーをすべて消します（メモは残ります）。`, '消す', true))) return;
    this.hist.push({ op: 'clear', pages: this.ann.pages }); this.ann.pages = {};
    this.pages.forEach(p => this.drawInk(p)); this.save();
  }
  save(now) {
    clearTimeout(this.st);
    const run = () => {
      this.st = null;
      const has = Object.values(this.ann.pages).some(a => a.length) || !!this.ann.memo.trim();
      idb.set('ann', annKey(this.id), { pages: this.ann.pages, memo: this.ann.memo, updatedAt: Date.now() });
      if (!!S.prefs.inked[this.id] !== has) { has ? (S.prefs.inked[this.id] = 1) : delete S.prefs.inked[this.id]; savePrefs(); }
    };
    if (now) run(); else this.st = setTimeout(run, 400);
  }
  destroy() {
    if (this.st) this.save(true);
    this.dead = true; this.io?.disconnect();
    this.pages.forEach(p => p.task?.cancel());
    this.pdf?.destroy();
  }
}
function drawStroke(ctx, s, W, H) {
  const a = s.p; if (!a || a.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = s.c; ctx.lineWidth = Math.max(1, s.w * W);
  if (s.t === 'marker') ctx.globalAlpha = 0.4;
  ctx.beginPath(); ctx.moveTo(a[0] * W, a[1] * H);
  if (a.length === 2) ctx.lineTo(a[0] * W + 0.1, a[1] * H);
  else {
    for (let i = 2; i < a.length - 2; i += 2) {
      const mx = (a[i] + a[i + 2]) / 2, my = (a[i + 1] + a[i + 3]) / 2;
      ctx.quadraticCurveTo(a[i] * W, a[i + 1] * H, mx * W, my * H);
    }
    ctx.lineTo(a[a.length - 2] * W, a[a.length - 1] * H);
  }
  ctx.stroke(); ctx.restore();
}
function strokeHit(s, x, y, r, ar) {
  const a = s.p, r2 = r * r;
  const d2 = (px, py) => { const dx = px - x, dy = (py - y) * ar; return dx * dx + dy * dy; };
  if (a.length === 2) return d2(a[0], a[1]) <= r2;
  for (let i = 0; i < a.length - 2; i += 2) {
    const x1 = a[i], y1 = a[i + 1] * ar, x2 = a[i + 2], y2 = a[i + 3] * ar, py = y * ar;
    const vx = x2 - x1, vy = y2 - y1, L = vx * vx + vy * vy;
    let t = L ? ((x - x1) * vx + (py - y1) * vy) / L : 0; t = Math.max(0, Math.min(1, t));
    const dx = x1 + t * vx - x, dy = y1 + t * vy - py;
    if (dx * dx + dy * dy <= r2) return true;
  }
  return false;
}

/* =====================================================================
   起動
   ===================================================================== */
async function init() {
  mount(h('div', { class: 'center-wrap' }, h('p', { class: 'hint' }, '読み込み中…')));
  try { S.backend = DEMO ? makeDemoBackend() : await makeFirebaseBackend(FIREBASE_CONFIG); }
  catch (e) { mount(h('div', { class: 'center-wrap' }, h('div', { class: 'panel' }, h('h2', {}, '接続できませんでした'), h('p', { class: 'hint' }, String(e.message || e))))); return; }
  try {
    const cfg = await S.backend.getConfig();
    S.teacher = !!cfg.teacherHash && LS.get('yk:teacher') === cfg.teacherHash;
    const code = hashCode();
    if (code && S.me.name && await S.backend.getTableMeta(code)) return enterTable(code);
  } catch (e) { console.error(e); return renderJoin('接続エラー：' + e.message); }
  renderJoin();
}
init();
})();
</script>
